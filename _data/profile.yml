short_bio:
  - 'I am a Research Assistant in CITI at Academia Sinica, working with <a href="https://www.citi.sinica.edu.tw/pages/pullpull/index_en.html" target="_blank" rel="noopener noreferrer">Dr. Jun-Cheng Chen</a> on generative models and computer vision. I received my Master&apos;s degree in Robotics from National Yang Ming Chiao Tung University in January 2023, advised by <a href="https://www.cs.nycu.edu.tw/members/detail/yschen" target="_blank" rel="noopener noreferrer">Prof. Yong-Sheng Chen</a> and <a href="https://walonchiu.github.io/" target="_blank" rel="noopener noreferrer">Prof. Wei-Chen (Walon) Chiu</a>. Before that, I studied computer science at National Chengchi University with <a href="http://www.cs.nccu.edu.tw/~ytpeng/" target="_blank" rel="noopener noreferrer">Prof. Yan-Tsung Peng</a>, worked as a research assistant at the Enriched Vision Applications Lab at National Chiao Tung University, and received my Bachelor&apos;s degree in Mathematical Science from National Chengchi University in January 2018.'

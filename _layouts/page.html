layout: default

<section class="page-hero">
  <div class="container">
    <p class="eyebrow">{{ page.kicker | default: site.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}
      <p>{{ page.lede }}</p>
    {% endif %}
  </div>
</section>

<div class="container page-content">
  {{ content }}
</div>
